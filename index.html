  <script src="/_sdk/8fed440c6f94b5da.data_sdk.js" integrity="sha512-hrvcCCJ6nkL5gG3mdqPDbgyAf9a/fg/zBF51sU5N3rM1WmeSu8K36+6wn9TZeAZrLIonoaPBeVyFsXxXxZjq0w=="></script>
  <script>
  // Place the principal welcome before the school information on Muqaddimah.
  const muqaddimah = document.getElementById('page-muqaddimah');
  const sambutanSection = document.getElementById('page-sambutan');
  if (muqaddimah && sambutanSection) document.body.insertBefore(sambutanSection, muqaddimah);

  // Page navigation
  function showPage(pageId) {
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById('page-' + pageId);
    const sambutan = document.getElementById('page-sambutan');
    if (sambutan) sambutan.classList.toggle('active', pageId === 'muqaddimah');
    if (target) {
      target.classList.add('active');
      window.scrollTo(0, 0);
      // Trigger fade-in animations
      target.querySelectorAll('.fade-in').forEach(el => {
        el.classList.remove('visible');
        setTimeout(() => el.classList.add('visible'), 100);
      });
      if (pageId === 'muqaddimah' && sambutan) {
        sambutan.querySelectorAll('.fade-in').forEach(el => {
          el.classList.remove('visible');
          setTimeout(() => el.classList.add('visible'), 100);
        });
      }
    }
  }

  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const page = link.dataset.page;
      if (page) showPage(page);
      document.getElementById('mobile-menu').classList.add('hidden');
    });
  });

  // Mobile menu
  document.getElementById('mobile-menu-btn').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  });

  // Data SDK for contact form
  const dataHandler = { onDataChanged() {} };
  async function initApp() {
    await window.dataSdk.init(dataHandler);
  }
  initApp();

  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.querySelector('[data-template-id="form-submit-btn"]');
    btn.disabled = true;
    btn.style.opacity = '0.6';
    document.getElementById('form-success').classList.add('hidden');
    document.getElementById('form-error').classList.add('hidden');

    const result = await window.dataSdk.create({
      name: document.getElementById('contact-name').value,
      email: document.getElementById('contact-email').value,
      phone: document.getElementById('contact-phone').value || '',
      message: document.getElementById('contact-message').value,
      submitted_at: new Date().toISOString()
    });

    btn.disabled = false;
    btn.style.opacity = '1';

    if (result.isOk) {
      document.getElementById('form-success').classList.remove('hidden');
      e.target.reset();
    } else {
      document.getElementById('form-error').classList.remove('hidden');
    }
  });

  lucide.createIcons();
</script>
